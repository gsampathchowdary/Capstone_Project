name: CI Pipeline - Zepto Data & AI Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Execution Pipeline Test
        run: |
          python run_all.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: zepto-platform-api:latest

      - name: Test Docker Container Run & Health Check
        run: |
          docker run -d -p 7860:7860 --name test-zepto-container zepto-platform-api:latest
          # Give FastAPI a few seconds to initialize
          sleep 5
          # Test health or root endpoint
          curl --fail http://localhost:7860/ || curl --fail http://localhost:7860/docs